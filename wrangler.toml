name = "reminders"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Static assets produced by @sveltejs/adapter-cloudflare. The Worker serves
# everything that is not a static file (_app/*, favicon, fonts, ...).
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[vars]
# Client ID of the GitHub OAuth app
# (https://github.com/settings/developers). The app's callback URL must be
# `${APP_URL}/auth/callback`. For local dev you can override this in .dev.vars.
GITHUB_CLIENT_ID = "Ov23liaVhWsXg358CBZr"
APP_URL = "https://reminders.franciscaportugal2005.workers.dev"

# Local development secrets go in .dev.vars (see .dev.vars.example).
# Production secrets are set with:
# wrangler secret put GITHUB_CLIENT_SECRET
# wrangler secret put SESSION_SECRET
# wrangler secret put CRON_SECRET

[[d1_databases]]
binding = "DB"
database_name = "github-pm-reminders-db"
database_id = "a6ac6f32-8457-4ac8-8154-7fd29b6e5782"

# For automated periodic scans, point an external cron service at /api/scan
# with the x-cron-secret header matching CRON_SECRET.
